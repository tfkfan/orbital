version: '3.8'

services:
  vmagent:
    image: victoriametrics/vmagent:v1.138.0
    ports:
      - 8429:8429
    volumes:
      - ./vmagentdata:/vmagentdata
      - ./vm-config/config.yml:/etc/vm/config.yml
    command:
      - "--promscrape.config=/etc/vm/config.yml"
      - "--remoteWrite.url=http://vm:8428/api/v1/write"
    restart: always
    depends_on:
      - "vm"

  vm:
    image: victoriametrics/victoria-metrics:v1.138.0
    ports:
      - 8428:8428
      - 8089:8089
      - 8089:8089/udp
      - 2003:2003
      - 2003:2003/udp
      - 4242:4242
    command:
      - "--storageDataPath=/storage"
      - "--graphiteListenAddr=:2003"
      - "--opentsdbListenAddr=:4242"
      - "--httpListenAddr=:8428"
      - "--influxListenAddr=:8089"
    volumes:
      - ./data/vm_data:/storage
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./provisioning/datasources/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    depends_on:
      - vm
    restart: unless-stopped